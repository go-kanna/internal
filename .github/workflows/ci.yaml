name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  test:
    strategy:
      matrix:
        include:
          - go-version-file: go.mod
          - go-version: stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        if: matrix.go-version-file == 'go.mod'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  # Each generator's tests, against this internal rather than the release it
  # requires, so that a change here meets the code that uses it before a tag.
  generators:
    name: generators (${{ matrix.repository }})
    strategy:
      fail-fast: false
      matrix:
        repository: [config, di, fixture, i18n, kanna, mapper, orm, validator, value]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: internal

      # A change here that a generator has to follow comes with a branch of the
      # same name there; any other generator is tested on its default branch.
      - name: Choose the generator's branch
        id: branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REPOSITORY: go-kanna/${{ matrix.repository }}
        run: |
          if git ls-remote --exit-code "https://github.com/$REPOSITORY" "refs/heads/$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7.0.1
        with:
          repository: go-kanna/${{ matrix.repository }}
          ref: ${{ steps.branch.outputs.ref }}
          path: generator

      # The workspace's Go, which an example may ask a newer one of than the
      # generator's module does. kanna has no workspace, so its module's Go.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: generator/${{ hashFiles('generator/go.work') != '' && 'go.work' || 'go.mod' }}

      - name: Use this internal in the generator's workspace
        working-directory: generator
        run: |
          [ -f go.work ] || go work init .
          go work use ../internal

      - name: Run the generator's tests
        working-directory: generator
        run: make test

  # A user's module selects one internal for every generator it has as a tool,
  # so each released generator and kanna has to build with this one too.
  released:
    name: released generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: internal

      # A release may ask a newer Go than this module does.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable

      - name: Add the latest release of each generator and kanna as a tool
        run: |
          mkdir released && cd released
          go mod init example.com/released
          go mod edit -replace github.com/go-kanna/internal=../internal
          go get -tool \
            github.com/go-kanna/kanna@latest \
            github.com/go-kanna/config/cmd/kanna-config@latest \
            github.com/go-kanna/di/cmd/kanna-di@latest \
            github.com/go-kanna/fixture/cmd/kanna-fixture@latest \
            github.com/go-kanna/i18n/cmd/kanna-i18n@latest \
            github.com/go-kanna/mapper/cmd/kanna-mapper@latest \
            github.com/go-kanna/orm/cmd/kanna-orm@latest \
            github.com/go-kanna/validator/cmd/kanna-validator@latest \
            github.com/go-kanna/value/cmd/kanna-value@latest

      - name: Build them with this internal
        working-directory: released
        run: go build tool
