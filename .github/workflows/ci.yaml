name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  test:
    strategy:
      matrix:
        include:
          - go-version-file: go.mod
          - go-version: stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        if: matrix.go-version-file == 'go.mod'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  # Each generator's tests, against this internal rather than the release it
  # requires, so that a change here meets the code that uses it before a tag.
  generators:
    name: generators (${{ matrix.repository }})
    strategy:
      fail-fast: false
      matrix:
        repository: [di, fixture, i18n, mapper, orm, validate, value]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: internal

      - uses: actions/checkout@v7.0.1
        with:
          repository: go-kanna/${{ matrix.repository }}
          path: generator

      # The workspace's Go, which an example may ask a newer one of than the
      # generator's module does.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: generator/go.work

      - name: Use this internal in the generator's workspace
        working-directory: generator
        run: go work use ../internal

      - name: Run the generator's tests
        working-directory: generator
        run: make test
